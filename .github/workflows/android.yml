name: Android CI
run-name: ${{github.workflow}} - ${{vars.TAG}} - ${{github.sha}}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch'
        required: true
        default: 'main'

permissions:
    id-token: write
    contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.branch }}
    - name: set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Install NDK r30 and CMake 4.4.4
      shell: bash
      run: |
        set -euo pipefail
        bash tools/install-native-toolchain.sh
        printf '\ncmake.dir=%s\n' "$HOME/.local/share/mail-tools/cmake-4.4.4" >> local.properties

    - name: Decode signing keystore
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [ -n "${KEYSTORE_BASE64:-}" ]; then
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.p12"
          chmod 600 "$RUNNER_TEMP/keystore.p12"
        else
          echo "Signing keystore is not configured; release will be unsigned."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Optional quality checks; APK assembly and packaging validation run below.
    # - name: Check with Lint
    #   run: ./gradlew --no-daemon --max-workers=1 --no-build-cache --no-configuration-cache lintRelease lintLarge lintDebug :app:testDebugUnitTest

    - name: Build with Gradle
      env:
        ORG_GRADLE_PROJECT_storeFilePath: ${{ runner.temp }}/keystore.p12
        ORG_GRADLE_PROJECT_keyAlias: ${{ secrets.KEY_ALIAS }}
        ORG_GRADLE_PROJECT_storePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        JAVA_TOOL_OPTIONS: "-XX:ActiveProcessorCount=1"
      shell: bash
      run: |
        set -euo pipefail
        if [ -s "$RUNNER_TEMP/keystore.p12" ] && [ -n "${ORG_GRADLE_PROJECT_keyAlias:-}" ] && [ -n "${ORG_GRADLE_PROJECT_storePassword:-}" ]; then
          export ORG_GRADLE_PROJECT_storeFilePath ORG_GRADLE_PROJECT_keyAlias
          export ORG_GRADLE_PROJECT_storePassword
        else
          unset ORG_GRADLE_PROJECT_storeFilePath ORG_GRADLE_PROJECT_keyAlias
          unset ORG_GRADLE_PROJECT_storePassword
          echo "Signing configuration unavailable; building unsigned release APKs."
        fi
        ./gradlew --no-daemon --max-workers=1 \
          --no-build-cache --no-configuration-cache \
          assembleRelease assembleLarge assembleDebug
          
    - name: Verify native ABIs, JNI exports and 16 KiB alignment
      run: python3 tools/check-native-packaging.py

    - name: Verify provider classes and per-variant OAuth callbacks
      run: python3 tools/check-api-variants.py

    - uses: actions/upload-artifact@v7
      with:
        name: APK-Release
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
    
    - uses: actions/upload-artifact@v7
      with:
        name: APK-Large
        path: app/build/outputs/apk/large/*.apk
        if-no-files-found: error
    
    - uses: actions/upload-artifact@v7
      with:
        name: APK-Debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Remove temporary signing files
      if: ${{ always() }}
      run: rm -f "$RUNNER_TEMP/keystore.p12" keystore.properties
